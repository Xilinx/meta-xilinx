#@TYPE: Machine
#@NAME: versal-2vp-generic
#@DESCRIPTION: Generic machine configuration for the AMD Versal Series Gen 2 adaptive SoC family (Cortex-A72 APU, Cortex-R5 RPU, and MicroBlaze PMC/PSM). Required by board- and series-specific Versal Gen 2 machines.

#### Preamble
MACHINEOVERRIDES =. "${@['', 'versal-2vp-generic:']['versal-2vp-generic' != '${MACHINE}']}"
#### Regular settings follow

# Variables that changes based on hw design or board specific requirement must be
# defined before calling the required inclusion file else pre-expansion value
# defined in local.conf without machine override will not be reflected.

# Yocto Versal u-boot-xlnx variables
DEFAULT_UBOOT_MACHINE ?= "xilinx_versal_virt_defconfig"
UBOOT_MACHINE ?= "${DEFAULT_UBOOT_MACHINE}"
BOOTMODE ?= "generic.root"

# Yocto Versal arm-trusted-firmware(TF-A) variables
TFA_BL33_LOAD ?= "0x8000000"

# Yocto Versal KERNEL Variables
UBOOT_ENTRYPOINT  ?= "0x200000"
UBOOT_LOADADDRESS ?= "0x200000"

# Versal Serial Console
SERIAL_CONSOLES ?= "115200;ttyAMA0"

require conf/machine/include/soc-versal-2vp.inc
require conf/machine/include/machine-xilinx-default.inc
require conf/machine/include/machine-xilinx-qemu.inc

MACHINE_FEATURES += "rtc ext2 ext3 vfat usbhost"

# Default SD image build onfiguration, use qemu-sd to pad
IMAGE_CLASSES += "image-types-xilinx-qemu"
# Add wic.qemu-sd only if initramfs_image not set due to circular dependecies
IMAGE_FSTYPES += "${@'wic.qemu-sd' if (d.getVar('INITRAMFS_IMAGE') or '') == '' else 'cpio.gz.u-boot.qemu-sd-fatimg'}"

UBOOT_BOOT_SCRIPT ?= "u-boot-xlnx-scr"

IMAGE_BOOT_FILES += " \
    ${KERNEL_IMAGETYPE} \
    boot.scr \
    "

# Versal_2vp QEMU Configurations
# This machine has a QEMU model, runqemu setup:
QB_MACHINE ?= "-machine arm-generic-fdt"

QB_MEM ?= "-m 8G"

# Iteration appears to be eth0 then eth1
QB_NETWORK_DEVICE ?= "-net nic,netdev=net0,macaddr=@MAC@ -net nic"
QB_KERNEL_CMDLINE_APPEND ?= ""

QEMU_HW_DTB_PATH ?= "qemu-hw-devicetrees/multiarch"
QEMU_HW_DTB_PS ?= "${QEMU_HW_DTB_PATH}/board-versal2-ps-vpk360.dtb"
QEMU_HW_DTB_PMC ?= "${QEMU_HW_DTB_PATH}/board-versal2-pmc-vpk360.dtb"

# Four total serial ports defined in this model (according to the PS dts)
# the reference system has 2 ports allocated in Linux
#
#+-----------+---------------+---------------+---------------+------------+
#| hw serial | domain serial | device        | type          | address    |
#+-----------+---------------+---------------+---------------+------------+
#| serial0   |               | ppu0_mdm_uart | xps-uartlite  | 0xf0110000 |
#| serial1   |               | ppu1_mdm_uart | xps-uartlite  | 0xf0310000 |
#| serial2   | serial0       | serial        | pl011         | 0xff000000 |
#| serial3   | serial1       | serial        | pl011         | 0xff010000 |
#|           | serial2       | coresight     | coresight-1.0 | 0xf0800000 |
#+-----------+---------------+---------------+---------------+------------+
QEMU_HW_SERIAL ?= "-serial null -serial null -serial mon:stdio -serial null"

QB_DTB = "${QEMU_HW_DTB_PS}"

# TODO: May need custom arch
QB_OPT_APPEND += "-boot arch=versal -boot mode=${QEMU_HW_BOOT_MODE}"

# PLM instance args
QEMU_HW_PLM_OPT = " \
    -M microblaze-fdt \
    -hw-dtb @DEPLOY_DIR_IMAGE@/${QEMU_HW_DTB_PMC} \
    -display none \
    "

QB_OPT_APPEND += " -plm-args '${QEMU_HW_PLM_OPT}'"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' versal_2vp_generic']['versal-2vp-generic' != "${MACHINE}"]}"
