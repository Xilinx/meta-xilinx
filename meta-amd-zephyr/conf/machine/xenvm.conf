#@TYPE: Machine
#@NAME: xenvm
#@DESCRIPTION: Yocto machine that builds Zephyr RTOS images for the Zephyr BOARD 'xenvm' running under a Xen hypervisor with a GICv2 interrupt controller (Arm aarch64 guest).

