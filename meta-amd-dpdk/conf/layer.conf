# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "amd-dpdk"
BBFILE_PATTERN_amd-dpdk = "^${LAYERDIR}/"
BBFILE_PRIORITY_amd-dpdk = "6"

LAYERSUMMARY_amd-dpdk = "AMD DPDK enablement"
LAYERDESCRIPTION_amd-dpdk = "AMD additions to the upstream DPDK layer, \
carrying the core patches and build options required by the AMD poll \
mode drivers so that meta-dpdk remains a pristine upstream fork."

LAYERDEPENDS_amd-dpdk = "\
    core \
    dpdk \
    "

LAYERSERIES_COMPAT_amd-dpdk = "wrynose"
