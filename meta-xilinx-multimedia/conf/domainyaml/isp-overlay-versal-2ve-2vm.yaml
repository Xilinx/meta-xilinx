reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2

  # ISP memory layout spans 320MB including alignment gaps
  rproc6@c000000:
    label: rpu6_fw
    no-map: 1
    start: 0xc000000
    size: 56M
  rpu6-calib-load@f800000:
    label: rpu6_calib
    no-map: 1
    start: 0xf800000
    size: 160K
  rpu6-hal-mem-priv@f828000:
    label: rpu6_halpriv
    no-map: 1
    start: 0xf828000
    size: 16388K

  rproc7@1082a000:
    label: rpu7_fw
    no-map: 1
    start: 0x1082a000
    size: 56M
  rpu7-calib-load@1402a000:
    label: rpu7_calib
    no-map: 1
    start: 0x1402a000
    size: 160K
  rpu7-hal-mem-priv@14052000:
    label: rpu7_halpriv
    no-map: 1
    start: 0x14052000
    size: 16388K

  rproc8@15054000:
    label: rpu8_fw
    no-map: 1
    start: 0x15054000
    size: 56M
  rpu8-calib-load@18854000:
    label: rpu8_calib
    no-map: 1
    start: 0x18854000
    size: 160K
  rpu8-hal-mem-priv@1887c000:
    label: rpu8_halpriv
    no-map: 1
    start: 0x1887c000
    size: 16388K

  rproc9@1987e000:
    label: rpu9_fw
    no-map: 1
    start: 0x1987e000
    size: 56M
  rpu9-calib-load@1d07e000:
    label: rpu9_calib
    no-map: 1
    start: 0x1d07e000
    size: 160K
  rpu9-hal-mem-priv@1d0a6000:
    label: rpu9_halpriv
    no-map: 1
    start: 0x1d0a6000
    size: 16388K

  isp_mbox_buffer@1e0a8000:
    label: isp_mbox
    no-map: 1
    start: 0x1e0a8000
    size: 4M
  rpu-shared-mem@1e4a8000:
    label: rpu_shared
    no-map: 1
    start: 0x1e4a8000
    size: 256K
  vring@1fff7000:
    label: isp_vring
    no-map: 1
    start: 0x1fff7000
    size: 32K

amba_pl:
  visp_mbox_rpu_6:
    memory-region:
      - "&isp_mbox"

  visp_mbox_rpu_7:
    memory-region:
      - "&isp_mbox"

  visp_mbox_rpu_8:
    memory-region:
      - "&isp_mbox"

  visp_mbox_rpu_9:
    memory-region:
      - "&isp_mbox"

domains:
  APU_Linux:
    compatible: openamp,domain-v1
    access:
      - dev: visp_mbox_rpu_6
        flags: 0
      - dev: visp_mbox_rpu_7
        flags: 0
      - dev: visp_mbox_rpu_8
        flags: 0
      - dev: visp_mbox_rpu_9
        flags: 0
    reserved-memory:
      - rproc6@c000000
      - rpu6-calib-load@f800000
      - rpu6-hal-mem-priv@f828000
      - rproc7@1082a000
      - rpu7-calib-load@1402a000
      - rpu7-hal-mem-priv@14052000
      - rproc8@15054000
      - rpu8-calib-load@18854000
      - rpu8-hal-mem-priv@1887c000
      - rproc9@1987e000
      - rpu9-calib-load@1d07e000
      - rpu9-hal-mem-pri@1d0a6000
      - isp_mbox_buffer@1e0a8000
      - rpu-shared-mem@1e4a8000
      - vring@1fff7000
