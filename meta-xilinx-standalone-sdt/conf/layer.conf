# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend \
        "

BBFILE_COLLECTIONS += "xilinx-standalone-sdt"
BBFILE_PATTERN_xilinx-standalone-sdt = "^${LAYERDIR}/"
BBFILE_PRIORITY_xilinx-standalone-sdt = "7"

LAYERSUMMARY_xilinx-standalone-sdt = "AMD Xilinx Embedded Software \
(ESW) recipes (SDT flow)"
LAYERDESCRIPTION_xilinx-standalone-sdt = "Standalone (non-Linux) \
Embedded Software layer for AMD Xilinx FPGAs / SoCs using the system \
device tree (SDT) flow: ESW libraries, drivers, BSPs, and example \
applications consumed by AMP/multidomain machines."

# set layer path for this layer only
LAYER_PATH_xilinx-standalone-sdt = "${LAYERDIR}"

BBFILES_DYNAMIC += " \
openamp-layer:${LAYERDIR}/dynamic-layers/openamp-layer/recipes-*/*/*.bb \
openamp-layer:${LAYERDIR}/dynamic-layers/openamp-layer/recipes-*/*/*.bbappend \
"

# Allow other layers to find the root of this layer if necessary
META_XILINX_STANDALONE_EXP_PATH = "${LAYERDIR}"

LAYERDEPENDS_xilinx-standalone-sdt = "core \
	xilinx \
	xilinx-standalone \
	xilinx-microblaze \
	"

LAYERRECOMMENDS_xilinx-standalone-sdt = "openamp-layer"

LAYERSERIES_COMPAT_xilinx-standalone-sdt = "wrynose"

# Sanity check for meta-xilinx-standalone layer.
# Setting SKIP_META_XILINX_STANDALONE_SANITY_CHECK to "1" would skip the bbappend files check.
INHERIT += "sanity-meta-xilinx-standalone-sdt"
