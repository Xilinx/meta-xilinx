domains:
  APU_Linux:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_a53
        cpumask: 0xf
        mode:
          secure: true
          el: 0x3
    os,type: linux

  R5_0_ZEPHYR:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_r5_0
        cpumask: 0x1
        mode:
          secure: true
    os,type: zephyr

  R5_1_BAREMETAL:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_r5_1
        cpumask: 0x1
        mode:
          secure: true
          el: 0x3
    os,type: baremetal
