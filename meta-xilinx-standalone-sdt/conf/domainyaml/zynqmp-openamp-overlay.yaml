axi:
  psu_r5_0_atcm:
    start: 0x0
    size: 0x10000
    mpu-policy: [ readable, writable, executable, cacheable, static ]
  psu_r5_0_btcm:
    start: 0x20000
    size: 0x10000
    mpu-policy: [ readable, writable, cacheable ]

reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2
  vdev0vring0@9880000:
    { label: vdev0vring0, start: 0x9880000, size: 0x4000, no-map: 1 }
  vdev0vring1@9884000:
    { label: vdev0vring1, start: 0x9884000, size: 0x4000, no-map: 1 }
  vdev0buffer@9888000:
    { label: vdev0buffer, start: 0x9888000, size: 0x78000, no-map: 1 }
  trace@985f000:
    label: trace_buffer
    start: 0x0985f000
    size: 0x1000
    no-map: 1
    mpu-policy: [ readable, writable ]
  rproc0@9800000:
    label: rproc0
    start: 0x09800000
    size: 0x20000
    no-map: 1
    mpu-policy: [ readable, writable, executable, cacheable, static ]
  rsctbl@9820000:
    label: rsctbl
    start: 0x09820000
    size: 0x100
    no-map: 1
    mpu-policy: [ readable, writable ]

chosen:
  zephyr,ram-console: /reserved-memory/trace@985f000

domains:
  APU_Linux:
    compatible: openamp,domain-v1
    # Linux claims every device; domain_access keeps them all.
    access:
      - dev: "*"
    reserved-memory: [ vdev0buffer@9888000, vdev0vring1@9884000,
                       vdev0vring0@9880000, rproc0@9800000,
                       trace@985f000, rsctbl@9820000 ]
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      remoteproc-relation:
        compatible: openamp,remoteproc-v2
        relation0:
          remote: R5_0_ZEPHYR
          elfload: [ "psu(_|-)r5(_|-)0(_|-)atcm(_|-)global@ffe00000$",
                     "psu(_|-)r5(_|-)0(_|-)btcm(_|-)global@ffe20000$", rproc0@9800000,
                     trace@985f000, rsctbl@9820000 ]
      rpmsg-relation:
        compatible: openamp,rpmsg-v1
        relation0:
          remote: R5_0_ZEPHYR
          carveouts: [ vdev0vring0@9880000, vdev0vring1@9884000,
                       vdev0buffer@9888000 ]
          mbox: ipi_7_to_ipi_1

  R5_0_ZEPHYR:
    compatible: openamp,domain-v1
    zephyr-version: "4.3"
    # IPI1 controller of the RPMsg mailbox ipi_1_to_ipi_7.
    access:
      - dev: ipi1
    sram:
      - { dev: rproc0@9800000, start: 0x9800000, size: 0x20000 }
      - { dev: psu_r5_0_atcm@0, start: 0x0, size: 64K }
      - { dev: psu_r5_0_btcm@20000, start: 0x20000, size: 64K }
    reserved-memory: [ vdev0buffer@9888000, vdev0vring1@9884000,
                       vdev0vring0@9880000, rproc0@9800000,
                       trace@985f000, rsctbl@9820000 ]
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      rpmsg-relation:
        compatible: openamp,rpmsg-v1
        relation0:
          host: APU_Linux
          mbox: ipi_1_to_ipi_7
          carveouts: [ vdev0vring0@9880000, vdev0vring1@9884000,
                       vdev0buffer@9888000 ]
    linker:
      linker_file_output_name: openamp-zephyr.ld
      linker_memories: [ psu_r5_0_atcm, psu_r5_0_btcm, rproc0, rsctbl ]
      entry: _vector_table
      sections:
        vector_table: { region: psu_r5_0_atcm, offset: 0 }
        text: { region: psu_r5_0_atcm }
        rodata: { region: psu_r5_0_atcm }
        data: { region: psu_r5_0_btcm }
        bss: { region: psu_r5_0_btcm }
        noinit: { region: psu_r5_0_btcm }
        heap: { region: psu_r5_0_btcm }
        stack: { region: psu_r5_0_btcm }
        resource_table: { region: rsctbl, offset: 0 }
