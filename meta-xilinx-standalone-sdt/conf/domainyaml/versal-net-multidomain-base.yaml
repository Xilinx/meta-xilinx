domains:
  APU_Linux:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_a78
        cpumask: 0xff
        mode:
          secure: false
          el: 0x3
    os,type: linux

  RPU_Zephyr:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_r52_0
        cpumask: 0x1
        mode:
          secure: true
          el: 0x3
    os,type: zephyr

  RPU_1_BM:
    compatible: openamp,domain-v1
    cpus:
      - cluster: cpus_r52_1
        cpumask: 0x1
        mode:
          secure: true
          el: 0x3
    os,type: baremetal
