axi:
  psx_wizard_0_psxl_0_psx_r52_0a_atcm_global:
    mpu-policy: [ readable, writable, executable, cacheable, static ]
  psx_wizard_0_psxl_0_psx_r52_0a_btcm_global:
    mpu-policy: [ readable, writable, cacheable, static ]
  psx_wizard_0_psxl_0_psx_r52_0a_ctcm_global:
    mpu-policy: [ readable, writable, cacheable, static ]

reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2

  ddrboot@9800100:
    label: ddrboot
    no-map: 1
    start: 0x9800100
    size: 0x5DE00
    mpu-policy: [ readable, writable, executable, cacheable, static ]
  trace@985f000:
    label: trace_buffer
    start: 0x985f000
    size: 0x1000
    no-map: 1
    mpu-policy: [ readable, writable ]
  vdev0vring0@9880000:
    label: vdev0vring0
    start: 0x9880000
    size: 0x4000
    no-map: 1
  vdev0vring1@9884000:
    label: vdev0vring1
    start: 0x9884000
    size: 0x4000
    no-map: 1
  vdev0buffer@9888000:
    label: vdev0buffer
    size: 0x78000
    start: 0x9888000
    no-map: 1
  rsctbl@9800000:
    label: rsctbl
    start: 0x9800000
    size: 0x100
    no-map: 1
    mpu-policy: [ readable, writable ]

chosen:
  zephyr,ram-console: /reserved-memory/trace@985f000

domains:
  APU_Linux:
    compatible: openamp,domain-v1
    # Linux claims every device; domain_access keeps them all.
    access:
      - dev: "*"
    reserved-memory:
      - vdev0vring0@9880000
      - vdev0vring1@9884000
      - vdev0buffer@9888000
      - ddrboot@9800100
      - trace@985f000
      - rsctbl@9800000

    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      remoteproc-relation:
        compatible: openamp,remoteproc-v2
        relation0:
          remote: RPU_Zephyr
          elfload: [ psx_wizard_0_psxl_0_psx_r52_0a_atcm_global, psx_wizard_0_psxl_0_psx_r52_0a_btcm_global, psx_wizard_0_psxl_0_psx_r52_0a_ctcm_global, ddrboot@9800100, trace@985f000, rsctbl@9800000 ]

      rpmsg-relation:
        compatible: openamp,rpmsg-v1
        relation0:
          remote: RPU_Zephyr
          carveouts: [ vdev0vring0@9880000, vdev0vring1@9884000, vdev0buffer@9888000 ]
          mbox: ipi_nobuf1_to_ipi_nobuf2

  RPU_Zephyr:
    compatible: openamp,domain-v1
    os,type: zephyr
    zephyr-version: "4.3"
    xlnx,ddr-boot: true
    xlnx,zephyr,mems: [ ddrboot@9800100 ]
    # IPI_NOBUF2 controller of the RPMsg mailbox ipi_nobuf2_to_ipi_nobuf1,
    # the system timer and the TCMs the linker places code and data in.
    # sram entries are address ranges and do not keep these nodes through
    # domain_access.
    access:
      - dev: ipi_nobuf2
      - dev: ttc0
      - dev: psx_wizard_0_psxl_0_psx_r52_0a_atcm_global
      - dev: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global
      - dev: psx_wizard_0_psxl_0_psx_r52_0a_ctcm_global
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      rpmsg-relation:
        compatible: openamp,rpmsg-v1
        relation0:
          host: APU_Linux
          mbox: ipi_nobuf2_to_ipi_nobuf1
          carveouts: [ vdev0vring0@9880000, vdev0vring1@9884000, vdev0buffer@9888000 ]
    sram:
      - dev: ddrboot@9800100
        start: 0x9800100
        size: 0x5DE00
      - dev: psx_wizard_0_psxl_0_psx_r52_0a_atcm_global@eba00000
        label: psx_wizard_0_psxl_0_psx_r52_0a_atcm_global
        size: 64K
        spec_name: psx_wizard_0_psxl_0_psx_r52_0a_atcm_global
        start: '0xeba00000'
      - dev: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global@eba10000
        label: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global
        size: 32K
        spec_name: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global
        start: '0xeba10000'
      - dev: psx_wizard_0_psxl_0_psx_r52_0a_ctcm_global@eba20000
        label: psx_wizard_0_psxl_0_psx_r52_0a_ctcm_global
        size: 32K
        spec_name: psx_wizard_0_psxl_0_psx_r52_0a_ctcm_global
        start: '0xeba20000'
    reserved-memory:
        - ddrboot@9800100
        - trace@985f000
        - rsctbl@9800000
    linker:
      linker_file_output_name: openamp-zephyr.ld
      linker_memories: [ psx_wizard_0_psxl_0_psx_r52_0a_atcm_global, psx_wizard_0_psxl_0_psx_r52_0a_btcm_global, psx_wizard_0_psxl_0_psx_r52_0a_ctcm_global, ddrboot, rsctbl ]
      entry: _vector_table
      sections:
        vector_table: { region: psx_wizard_0_psxl_0_psx_r52_0a_atcm_global, offset: 0 }
        text: { region: psx_wizard_0_psxl_0_psx_r52_0a_atcm_global }
        rodata: { region: psx_wizard_0_psxl_0_psx_r52_0a_atcm_global }
        data: { region: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global }
        bss: { region: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global }
        noinit: { region: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global }
        heap: { region: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global }
        stack: { region: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global }
        resource_table: { region: rsctbl, offset: 0 }
