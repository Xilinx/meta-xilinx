  # linux -> rpu1 libmetal IPI
  mailbox@eb360000:
    linux,uio-name!linux: "libmetal-ipi"
    compatible!linux: "uio"         # linux overlay replaces it

domains:
  APU_Linux:
    compatible: openamp,domain-v1
    lopper,activate: linux
    access:
      - dev: timer@f1e90000
      - dev: mailbox@eb360000
      - dev: libmetal_uio_desc0@99c8000
      - dev: libmetal_uio_desc1@99cc000
      - dev: libmetal_uio_data@99d0000
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      libmetal-relation:
        compatible: libmetal,ipc-v1
        relation0:
          remote: RPU_1_BM
          carveouts: [ libmetal_uio_desc0@99c8000, libmetal_uio_desc1@99cc000, libmetal_uio_data@99d0000 ]
          mbox: ipi_3_to_ipi_2 # IPI3 OpenAMP example app (APU)
          timer: ttc3

  RPU_1_BM:
    compatible: openamp,domain-v1
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      libmetal-relation:
        compatible: libmetal,ipc-v1
        relation0:
          host: APU_Linux
          carveouts: [ libmetal_uio_desc0@99c8000, libmetal_uio_desc1@99cc000, libmetal_uio_data@99d0000 ]
          mbox: ipi_2_to_ipi_3 #IPI2 Libmetal example app (RPU)
          timer: ttc3
          elfload: [ libmetal_elf@9968000 ]

    sram:
      - dev: libmetal_elf@9968000
        start: 0x9968000
        size: 0x60000
      - dev: r52_1a_atcm_global@eba40000
        label: r52_1a_atcm_global
        size: 64K
        spec_name: R52_1A_ATCM_GLOBAL
        start: '0xeba40000'
      - dev: r52_1a_btcm_global@eba50000
        label: r52_1a_btcm_global
        size: 32K
        spec_name: R52_1A_BTCM_GLOBAL
        start: '0xeba50000'
      - dev: r52_1a_ctcm_global@eba60000
        label: r52_1a_ctcm_global
        size: 32K
        spec_name: R52_1A_CTCM_GLOBAL
        start: '0xeba60000'
    memory:
      - dev: NoC_C0_C1_ddr_memory
        start: 0x09968000
        size: 0x60000
    access:
      - dev: i2c@f1940000
