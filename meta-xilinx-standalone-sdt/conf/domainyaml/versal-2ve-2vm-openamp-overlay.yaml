axi:
  r52_0a_atcm_global:
    mpu-policy: [ readable, writable, executable, cacheable, static ]
  r52_0a_btcm_global:
    mpu-policy: [ readable, writable, cacheable, static ]
  r52_0a_ctcm_global:
    mpu-policy: [ readable, writable, cacheable, static ]

reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2

  ddrboot@9800100:
    label: ddrboot
    no-map: 1
    start: 0x9800100
    size: 0x5DE00
    mpu-policy: [ readable, writable, executable, cacheable, static ]
  trace@985f000:
    label: trace_buffer
    start: 0x985f000
    size: 0x1000
    no-map: 1
    mpu-policy: [ readable, writable ]
  vdev0vring0@9880000:
    label: vdev0vring0
    start: 0x9880000
    size: 0x4000
    no-map: 1
  vdev0vring1@9884000:
    label: vdev0vring1
    start: 0x9884000
    size: 0x4000
    no-map: 1
  vdev0buffer@9888000:
    label: vdev0buffer
    size: 0x78000
    start: 0x9888000
    no-map: 1
  rsctbl@9800000:
    label: rsctbl
    start: 0x9800000
    size: 0x100
    no-map: 1
    mpu-policy: [ readable, writable ]

chosen:
  zephyr,ram-console!zephyr: /reserved-memory/trace@985f000

domains:
  APU_Linux:
    compatible: openamp,domain-v1
    reserved-memory:
      - vdev0vring0@9880000
      - vdev0vring1@9884000
      - vdev0buffer@9888000
      - ddrboot@9800100
      - trace@985f000
      - rsctbl@9800000

    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      remoteproc-relation:
        compatible: openamp,remoteproc-v2
        relation0:
          remote: RPU_Zephyr
          elfload: [ r52_0a_atcm_global, r52_0a_btcm_global, r52_0a_ctcm_global, ddrboot@9800100, trace@985f000, rsctbl@9800000 ]

      rpmsg-relation:
        compatible: openamp,rpmsg-v1
        relation0:
          remote: RPU_Zephyr
          carveouts: [ vdev0vring0@9880000, vdev0vring1@9884000, vdev0buffer@9888000 ]
          mbox: ipi_1_nobuf_to_ipi_2_nobuf #IPI_BO_BUF1 OpenAMP example app (APU)

  RPU_Zephyr:
    compatible: openamp,domain-v1
    lopper,activate: zephyr
    os,type: zephyr
    zephyr-version: "4.3"
    xlnx,ddr-boot: true
    xlnx,zephyr,mems: [ ddrboot@9800100 ]
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      rpmsg-relation:
        compatible: openamp,rpmsg-v1
        relation0:
          host: APU_Linux
          mbox: ipi_2_nobuf_to_ipi_1_nobuf #IPI_NO_BUF2 OpenAMP example app (RPU)
          carveouts: [ vdev0vring0@9880000, vdev0vring1@9884000, vdev0buffer@9888000 ]
    sram:
      - dev: ddrboot@9800100
        start: 0x9800100
        size: 0x5DE00
      - dev: r52_0a_atcm_global@eba00000
        label: r52_0a_atcm_global
        size: 64K
        spec_name: R52_0A_ATCM_GLOBAL
        start: '0xeba00000'
      - dev: r52_0a_btcm_global@eba10000
        label: r52_0a_btcm_global
        size: 32K
        spec_name: R52_0A_BTCM_GLOBAL
        start: '0xeba10000'
      - dev: r52_0a_ctcm_global@eba20000
        label: r52_0a_ctcm_global
        size: 32K
        spec_name: R52_0A_CTCM_GLOBAL
        start: '0xeba20000'
    reserved-memory:
        - ddrboot@9800100
        - trace@985f000
        - rsctbl@9800000
    access:
      - dev: timer@f1e80000
      - dev: mailbox@eb340000
      - dev: mailbox@eb3b1000
      - dev: r52_0a_atcm_global@eba00000
      - dev: r52_0a_btcm_global@eba10000
      - dev: r52_0a_ctcm_global@eba20000
    linker:
      linker_file_output_name: openamp-zephyr.ld
      linker_memories: [ r52_0a_atcm_global, r52_0a_btcm_global, r52_0a_ctcm_global, ddrboot, rsctbl ]
      entry: _vector_table
      sections:
        vector_table: { region: r52_0a_atcm_global, offset: 0 }
        text: { region: r52_0a_atcm_global }
        rodata: { region: r52_0a_atcm_global }
        data: { region: r52_0a_btcm_global }
        bss: { region: r52_0a_btcm_global }
        noinit: { region: r52_0a_btcm_global }
        heap: { region: r52_0a_btcm_global }
        stack: { region: r52_0a_btcm_global }
        resource_table: { region: rsctbl, offset: 0 }
