# Workaround for a Lopper bug: the libmetal relations below use a phandle
# property named "timer", and the ZynqMP architected timer node is also
# labelled "timer". When Lopper regenerates __symbols__ for a domain it
# types the "timer" symbol as a phandle ("/timer" becomes <0x2f74696d>),
# and the OpenAMP assist then fails in get_label(). Relabel the timer so
# its symbol does not match the relation property name. The long-term fix
# belongs in Lopper (__symbols__ entries are always path strings); drop
# this relabel once that fix is available.
timer:
  label: arm_generic_timer

reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2

  libmetal_elf@9968000:
    label: libmetal_elf
    start: 0x9968000
    size: 0x60000
    no-map: 1
  libmetal_desc0@99c8000:
    label: libmetal_desc0
    start: 0x99c8000
    size: 0x4000
    no-map: 1
  libmetal_desc1@99cc000:
    label: libmetal_desc1
    start: 0x99cc000
    size: 0x4000
    no-map: 1
  libmetal_data@99d0000:
    label: libmetal_data
    start: 0x99d0000
    size: 0x40000
    no-map: 1

axi:
  libmetal_uio_desc0@99c8000:
    linux,uio-name: "libmetal-desc0"
    start: 0x99c8000
    size: 0x4000
    compatible: "uio"
  libmetal_uio_desc1@99cc000:
    linux,uio-name: "libmetal-desc1"
    start: 0x99cc000
    size: 0x4000
    compatible: "uio"
  libmetal_uio_data@99d0000:
    linux,uio-name: "libmetal-data"
    start: 0x99d0000
    size: 0x40000
    compatible: "uio"

  timer@ff130000:
    compatible: "uio"
    linux,uio-name: "libmetal-timer"
  # linux -> rpu1 libmetal IPI
  ipi@ff350000:
    compatible: "uio"
    linux,uio-name: "libmetal-ipi"

domains:
  APU_Linux: # host in channel from a53-0
    compatible: openamp,domain-v1
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      libmetal-relation:
        compatible: libmetal,ipc-v1
        relation0:
          remote: R5_1_BAREMETAL
          carveouts: [ libmetal_uio_desc0@99c8000, libmetal_uio_desc1@99cc000, libmetal_uio_data@99d0000 ]
          mbox: ipi_8_to_ipi_2
          timer: ttc2

  R5_1_BAREMETAL:
    compatible: openamp,domain-v1
    domain-to-domain:
      compatible: openamp,domain-to-domain-v1
      libmetal-relation:
        compatible: libmetal,ipc-v1
        relation0:
          host: APU_Linux
          carveouts: [ libmetal_uio_desc0@99c8000, libmetal_uio_desc1@99cc000, libmetal_uio_data@99d0000 ]
          mbox: ipi_2_to_ipi_8 #IPI2 Libmetal example app (RPU)
          timer: ttc2
          elfload: [ libmetal_elf@9968000 ]

    sram:
      - dev: libmetal_elf@9968000
        start: 0x9968000
        size: 0x60000
      - dev: psu_r5_1_atcm_global@ffe90000
        size: 64K
        start: 0xffe90000
