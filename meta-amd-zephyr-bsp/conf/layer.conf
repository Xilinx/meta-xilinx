# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "amd-zephyr-bsp"
BBFILE_PATTERN_amd-zephyr-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_amd-zephyr-bsp = "6"

# Currently no files, so set an empty pattern means ignore the error
BBFILE_PATTERN_IGNORE_EMPTY_amd-zephyr-bsp = "1"

LAYERSUMMARY_amd-zephyr-bsp = "AMD Zephyr RTOS BSP layer"
LAYERDESCRIPTION_amd-zephyr-bsp = "BSP layer for AMD \
Zephyr RTOS BOARD machine configurations."

LAYERDEPENDS_amd-zephyr-bsp = "\
    core \
    meta-python \
    zephyrcore \
    xilinx \
    amd-zephyr \
    "

LAYERSERIES_COMPAT_amd-zephyr-bsp = "wrynose"
