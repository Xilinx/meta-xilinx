Section "InputDevice"
    Identifier      "System Mouse"
    Driver          "mouse"
    Option          "Device" "/dev/input/mouse0"
EndSection

Section "InputDevice"
    Identifier      "System Keyboard"
    Driver          "kbd"
    Option          "Device" "/dev/input/event0"
EndSection

Section "OutputClass"
    Identifier      "Zynqmp-DP"
    MatchDriver     "zynqmp-dpsub"
    Driver          "modesetting"
    Option          "PrimaryGPU" "true"
    Option          "AccelMethod" "glamor"
EndSection

Section "ServerFlags"
    Option          "AutoAddGPU" "off"
    Option          "Debug" "dmabuf_capable"
EndSection

Section "Screen"
    Identifier      "DefaultScreen"
    DefaultDepth    24
EndSection
