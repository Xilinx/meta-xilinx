[Unit]
# Connector directories are named card<N>-<connector>. A render-only
# DRM card registers none, and the display controller is not always
# card0.
ConditionPathExistsGlob=/sys/class/drm/card*-*

[Service]
# Start kmsconvt only if at least one display connector is not
# disconnected. grep -L lists files that do NOT match the pattern,
# so connectors reporting "connected" or "unknown" pass through.
# The trailing grep -q succeeds if any such file exists. A non-zero
# exit from ExecCondition leaves the unit inactive and skipped.
ExecCondition=/bin/sh -c 'grep -rL ^disconnected /sys/class/drm/card*-*/status | grep -q .'
